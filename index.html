<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Check-In System - QR Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 14px;
        }

        /* ---------- Header + compact stats bar ---------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #333;
            font-size: 18px;
            white-space: nowrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            flex: 1;
            max-width: 260px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 5px 4px;
            border-radius: 8px;
            text-align: center;
            min-width: 0;
        }

        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 10px 4px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }

        .tab:hover,
        .tab.active { color: #667eea; }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #667eea;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ---------- QR Scanner ---------- */
        #qr-reader {
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #qr-reader video {
            border-radius: 10px;
            width: 100% !important;
        }

        #qr-reader__dashboard_section_swaplink { display: none !important; }

        .scanner-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:active { transform: translateY(1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-success { background: #28a745; }
        .btn-danger  { background: #dc3545; }

        /* ---------- Manual entry ---------- */
        .input-group { margin-bottom: 12px; }

        .input-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* ---------- Result: floating panel at the bottom of the screen ----------
           Always visible without scrolling, doesn't push the camera around.
           Tap the panel to close it. */
        .result {
            display: none;
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            max-width: 580px;
            margin: 0 auto;
            padding: 14px;
            border-radius: 14px;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .result.success { background: #d4edda; border: 2px solid #28a745; color: #155724; }
        .result.error   { background: #f8d7da; border: 2px solid #dc3545; color: #721c24; }
        .result.warning { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }

        .result-close {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.12);
            color: inherit;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .result-close:active { background: rgba(0, 0, 0, 0.25); }

        .result-icon {
            font-size: 30px;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .result-content { text-align: center; }
        .result-content h2 { margin-bottom: 6px; font-size: 18px; }
        .result-content p  { font-size: 15px; line-height: 1.5; }

        .attendance-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
        }

        .badge-onsite { background: #d4edda; color: #155724; border: 1px solid #28a745; }

        /* ---------- Loading pill (also floating) ---------- */
        .loading {
            display: none;
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            max-width: 580px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            z-index: 60;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            font-size: 14px;
            color: #333;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            animation: spin 1s linear infinite;
            margin: 0 auto 6px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- Scanner status / last scanned ---------- */
        .scanner-status {
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .scanner-status.active { display: block; background: #d4edda; color: #155724; }
        .scanner-status.error  { display: block; background: #f8d7da; color: #721c24; }

        .last-scanned {
            background: #f8f9fa;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: none;
            font-size: 12px;
            color: #666;
        }

        .last-scanned.show { display: block; }

        .last-scanned-value {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header + compact statistics -->
        <div class="header">
            <h1>📋 Check-In</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalCheckedIn">-</div>
                    <div class="stat-label">Checked in</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalRegistered">-</div>
                    <div class="stat-label">Registered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="percentage">-</div>
                    <div class="stat-label">Arrived</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('scanner')">📷 Scanner</button>
            <button class="tab" onclick="switchTab('manual')">⌨️ Manual</button>
        </div>

        <!-- QR Scanner Tab -->
        <div id="scanner-tab" class="tab-content active">
            <div class="scanner-status" id="scannerStatus"></div>

            <div id="qr-reader"></div>

            <div class="scanner-controls">
                <button class="btn btn-success" id="startScanBtn" onclick="startScanning()">
                    Start Scanner
                </button>
                <button class="btn btn-danger" id="stopScanBtn" onclick="stopScanning()" style="display: none;">
                    Stop Scanner
                </button>
            </div>

            <div class="last-scanned" id="lastScanned">
                Last scanned: <span class="last-scanned-value" id="lastScannedValue">-</span>
            </div>

            <div class="loading" id="loading-scanner">
                <div class="loading-spinner"></div>
                <p>Processing check-in...</p>
            </div>
            <div class="result" id="result-scanner">
                <button class="result-close" aria-label="Close"
                        onclick="document.getElementById('result-scanner').style.display='none'">✕</button>
                <div class="result-icon" id="resultIcon-scanner"></div>
                <div class="result-content">
                    <h2 id="resultTitle-scanner"></h2>
                    <p id="resultMessage-scanner"></p>
                </div>
            </div>
        </div>

        <!-- Manual Entry Tab -->
        <div id="manual-tab" class="tab-content">
            <div class="input-group">
                <label for="uniqueId">Participant ID</label>
                <input
                    type="text"
                    id="uniqueId"
                    placeholder="SEM-20261113-A1B2C3D4E5"
                    autocomplete="off"
                >
            </div>
            <button class="btn" style="width:100%" onclick="checkInManual()">Check In Participant</button>

            <div class="loading" id="loading-manual">
                <div class="loading-spinner"></div>
                <p>Processing check-in...</p>
            </div>
            <div class="result" id="result-manual">
                <button class="result-close" aria-label="Close"
                        onclick="document.getElementById('result-manual').style.display='none'">✕</button>
                <div class="result-icon" id="resultIcon-manual"></div>
                <div class="result-content">
                    <h2 id="resultTitle-manual"></h2>
                    <p id="resultMessage-manual"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         QR LIBRARY LOADER (with fallbacks)
         Order: 1) local file next to this page  2) unpkg  3) jsDelivr
         ============================================================ -->
    <script>
        (function () {
            var sources = [
                'html5-qrcode.min.js',
                'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
                'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'
            ];

            function loadLib(i) {
                if (i >= sources.length) { window.qrLibFailed = true; return; }
                var s = document.createElement('script');
                s.src = sources[i];
                s.onload  = function () { window.qrLibSource = sources[i]; };
                s.onerror = function () { s.remove(); loadLib(i + 1); };
                document.head.appendChild(s);
            }
            loadLib(0);
        })();
    </script>

    <script>
        // ============================================================
        // CONFIGURATION — Google Apps Script Web App URL (current deployment)
        // ============================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-whrebay0KABeptWd7qEMOYhIcSGQRIcCTETOeKAZooiEVplZvIdswuXnBeZsK9VD/exec';

        // ============================================================
        // STATE
        // ============================================================
        let html5QrCode     = null;
        let isScanning      = false;
        let lastScannedCode = '';
        let scanCooldown    = false;

        // ============================================================
        // CONNECTION PRE-WARM
        // ============================================================
        function preWarmConnection() {
            fetch(SCRIPT_URL + '?action=warmUp', { method: 'GET', keepalive: true })
                .catch(() => {});
        }

        // ============================================================
        // STATISTICS
        // ============================================================
        async function fetchStats() {
            try {
                const response = await fetch(SCRIPT_URL + '?action=getStats', { cache: 'no-cache' });
                if (!response.ok) throw new Error('Network error');
                const stats = await response.json();

                document.getElementById('totalCheckedIn').textContent  = stats.totalCheckedIn  ?? '-';
                document.getElementById('totalRegistered').textContent = stats.totalRegistered ?? '-';
                document.getElementById('percentage').textContent      =
                    stats.totalRegistered ? stats.percentage + '%' : '-';

            } catch (error) {
                console.error('Error fetching statistics:', error);
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            if (tabName === 'scanner') {
                document.getElementById('scanner-tab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('manual-tab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
                if (isScanning) stopScanning();
            }

            document.getElementById('result-scanner').style.display = 'none';
            document.getElementById('result-manual').style.display  = 'none';
        }

        // ============================================================
        // QR SCANNER
        // ============================================================
        function startScanning() {
            const scannerStatus = document.getElementById('scannerStatus');

            if (typeof Html5Qrcode === 'undefined') {
                scannerStatus.className = 'scanner-status error';
                scannerStatus.textContent = window.qrLibFailed
                    ? '❌ QR library failed to load. Check internet, or use Manual.'
                    : '⏳ QR library is still loading. Please try again in a moment.';
                return;
            }

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    // Wide (4:3) camera view = shorter on phones; scan box = 75% of the view
                    aspectRatio: 1.3333,
                    qrbox: (w, h) => {
                        const s = Math.floor(Math.min(w, h) * 0.75);
                        return { width: s, height: s };
                    }
                },
                onScanSuccess,
                () => {}
            ).then(() => {
                isScanning = true;
                scannerStatus.className = 'scanner-status active';
                scannerStatus.textContent = '✅ Scanner active';
                document.getElementById('startScanBtn').style.display = 'none';
                document.getElementById('stopScanBtn').style.display  = 'block';
            }).catch(err => {
                scannerStatus.className = 'scanner-status error';
                scannerStatus.textContent = '❌ Camera access denied or not available (HTTPS required)';
                console.error('Scanner error:', err);
                alert('Camera access required! Please allow camera permissions in your browser settings.');
            });
        }

        function stopScanning() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    const scannerStatus = document.getElementById('scannerStatus');
                    scannerStatus.className = 'scanner-status';
                    scannerStatus.style.display = 'none';
                    document.getElementById('startScanBtn').style.display = 'block';
                    document.getElementById('stopScanBtn').style.display  = 'none';
                }).catch(console.error);
            }
        }

        function onScanSuccess(decodedText) {
            if (scanCooldown || decodedText === lastScannedCode) return;

            const fetchPromise = startCheckInFetch(decodedText);

            scanCooldown    = true;
            lastScannedCode = decodedText;

            document.getElementById('lastScanned').classList.add('show');
            document.getElementById('lastScannedValue').textContent = decodedText;

            playBeep();

            handleFetchPromise(fetchPromise, decodedText, 'scanner');

            setTimeout(() => { scanCooldown = false; }, 3000);
        }

        // ============================================================
        // CHECK-IN
        // ============================================================
        function startCheckInFetch(uniqueId) {
            const url = `${SCRIPT_URL}?action=checkIn&uniqueId=${encodeURIComponent(uniqueId.trim())}`;
            return fetch(url);
        }

        async function handleFetchPromise(fetchPromise, uniqueId, source) {
            document.getElementById(`loading-${source}`).style.display = 'block';
            document.getElementById(`result-${source}`).style.display  = 'none';

            try {
                const response = await fetchPromise;
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                handleCheckInResult(result, source);
                fetchStats();

            } catch (error) {
                if (source === 'scanner') lastScannedCode = '';
                console.error('Check-in error:', error);
                showResult(source, 'error', '❌', 'Error', 'Failed to process check-in: ' + escapeHtml(error.message));
                playErrorSound();
            } finally {
                document.getElementById(`loading-${source}`).style.display = 'none';
            }
        }

        async function checkIn(uniqueId, source) {
            if (!uniqueId || uniqueId.trim() === '') {
                showResult(source, 'error', '⚠️', 'Error', 'Please scan a valid QR code');
                return;
            }
            const fetchPromise = startCheckInFetch(uniqueId);
            await handleFetchPromise(fetchPromise, uniqueId, source);
        }

        function checkInManual() {
            const uniqueId = document.getElementById('uniqueId').value.trim();
            if (!uniqueId) return;
            checkIn(uniqueId, 'manual');
            document.getElementById('uniqueId').value = '';
        }

        // ============================================================
        // RESULT HANDLER
        // ============================================================
        function handleCheckInResult(result, source) {
            if (result.success) {
                showResult(
                    source,
                    'success',
                    '✅',
                    'Check-In Successful!',
                    `<strong>${escapeHtml(result.name)}</strong><br>
                     ${formatAttendance(result.attendance)}<br>
                     ${formatTime(result.checkInTime)}`
                );
                playSuccessSound();

            } else if (result.message === 'Already checked in') {
                showResult(
                    source,
                    'warning',
                    '⚠️',
                    'Already Checked In',
                    `<strong>${escapeHtml(result.name)}</strong><br>
                     ${formatTime(result.checkInTime)}<br>
                     ${formatAttendance(result.attendance)}`
                );
                playErrorSound();

            } else if (result.message === 'Participant not found' || result.message === 'Invalid ID') {
                showResult(
                    source,
                    'error',
                    '❌',
                    'Not Found',
                    'Participant ID not found. Please verify the QR code.'
                );
                playErrorSound();

            } else {
                if (source === 'scanner') lastScannedCode = '';
                showResult(
                    source,
                    'error',
                    '⚠️',
                    'Please try again',
                    escapeHtml(result.message || result.error || 'Unknown error')
                );
                playErrorSound();
            }
        }

        function formatAttendance(value) {
            if (!value) return '';
            return `<span class="attendance-badge badge-onsite">🏢 On-Site / 会場参加</span>`;
        }

        function formatTime(rawTime) {
            if (!rawTime) return '';
            try { return new Date(rawTime).toLocaleTimeString(); }
            catch (e) { return String(rawTime); }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ============================================================
        // DISPLAY
        // ============================================================
        function showResult(source, type, icon, title, message) {
            const el = document.getElementById(`result-${source}`);
            el.className = 'result ' + type;
            el.style.display = 'block';
            document.getElementById(`resultIcon-${source}`).textContent  = icon;
            document.getElementById(`resultTitle-${source}`).textContent = title;
            document.getElementById(`resultMessage-${source}`).innerHTML = message;
        }

        // ============================================================
        // SOUND EFFECTS
        // ============================================================
        function createOsc(freq, type, duration) {
            try {
                const ctx  = new (window.AudioContext || window.webkitAudioContext)();
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch (e) { /* audio not supported */ }
        }

        function playBeep()         { createOsc(800,  'sine',     0.1); }
        function playSuccessSound() { createOsc(1000, 'sine',     0.2); }
        function playErrorSound()   { createOsc(400,  'sawtooth', 0.3); }

        // ============================================================
        // KEYBOARD + LIFECYCLE
        // ============================================================
        document.getElementById('uniqueId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkInManual();
        });

        window.addEventListener('beforeunload', () => {
            if (isScanning) stopScanning();
        });

        window.addEventListener('load', () => {
            preWarmConnection();
            fetchStats();
            setInterval(fetchStats, 15000);
        });
    </script>
</body>
</html>
