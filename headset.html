<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SX2026 Special Seminar – Interpretation headset</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, 'Noto Sans JP', 'Noto Sans Thai', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 22px 20px 26px;
            margin-top: 8px;
        }

        /* language switcher */
        .lang { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 14px; }
        .lang button {
            border: 1px solid #d0d4e4;
            background: #fff;
            color: #555;
            border-radius: 14px;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
        }
        .lang button.active { background: #667eea; border-color: #667eea; color: #fff; }

        h1 { font-size: 19px; color: #333; line-height: 1.35; margin-bottom: 4px; }
        .event { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.5; }

        .hello { font-size: 16px; color: #333; margin-bottom: 14px; }
        .hello strong { color: #4a56c9; }

        .question { font-size: 17px; font-weight: 600; color: #222; line-height: 1.5; margin-bottom: 6px; }
        .hint     { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 16px; }
        .deadline { font-size: 13px; color: #856404; background: #fff3cd; border-radius: 8px;
                    padding: 8px 10px; margin-bottom: 16px; }

        .choices { display: grid; gap: 10px; }
        .choice {
            border: 2px solid #d0d4e4;
            background: #fff;
            color: #333;
            border-radius: 12px;
            padding: 16px 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: border-color .15s, background .15s;
        }
        .choice:hover:not(:disabled) { border-color: #667eea; }
        .choice.selected { border-color: #28a745; background: #eaf7ee; color: #155724; }
        .choice:disabled { opacity: .6; cursor: not-allowed; }

        .status { margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: 14px;
                  line-height: 1.5; display: none; }
        .status.show    { display: block; }
        .status.ok      { background: #d4edda; color: #155724; }
        .status.error   { background: #f8d7da; color: #721c24; }
        .status.loading { background: #eef0fb; color: #3b4290; }

        .retry { margin-top: 10px; border: none; background: #667eea; color: #fff;
                 border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

        .secretariat { margin-top: 22px; font-size: 12px; color: #888; line-height: 1.6;
                       border-top: 1px solid #eee; padding-top: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <div class="lang">
            <button data-lang="en" onclick="setLang('en')">EN</button>
            <button data-lang="ja" onclick="setLang('ja')">日本語</button>
            <button data-lang="th" onclick="setLang('th')">ไทย</button>
        </div>

        <h1 id="t-title"></h1>
        <div class="event" id="t-event"></div>

        <div id="form-area" class="hidden">
            <div class="hello" id="t-hello"></div>
            <div class="question" id="t-question"></div>
            <div class="hint" id="t-hint"></div>
            <div class="deadline" id="t-deadline"></div>

            <div class="choices">
                <button class="choice" id="btn-yes" onclick="choose('Yes')"></button>
                <button class="choice" id="btn-no"  onclick="choose('No')"></button>
            </div>
        </div>

        <div class="status" id="status"></div>
        <button class="retry hidden" id="retry" onclick="load()"></button>

        <div class="secretariat" id="t-secretariat"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        // Same Apps Script Web App as the check-in page (current deployment)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-whrebay0KABeptWd7qEMOYhIcSGQRIcCTETOeKAZooiEVplZvIdswuXnBeZsK9VD/exec';

        // TODO: fill in before sending
// ใช้ URL รูปธงชาติขนาดเล็ก (เช่นจาก flagcdn.com)
        const flagUS = '<img src="https://flagcdn.com/20x15/us.png" alt="US" style="vertical-align: middle; margin-right: 4px;">';
        const flagTH = '<img src="https://flagcdn.com/20x15/th.png" alt="TH" style="vertical-align: middle; margin-right: 4px;">';
 
        const INTERPRETATION = { 
            en: flagUS + ' English – ' + flagTH + ' Thai',
            ja: flagUS + ' 英語 – ' + flagTH + ' タイ語',
            th: flagUS + ' อังกฤษ – ' + flagTH + ' ไทย' 
        };
        };
        const DEADLINE       = { en: '[DEADLINE]', ja: '[DEADLINE]', th: '[DEADLINE]' };

        // ============================================================
        // TEXT (EN / JA / TH)
        // ============================================================
        const T = {
            en: {
                title:    'Interpretation headset',
                event:    'SX2026 Special Seminar · November 13, 2026<br>Queen Sirikit National Convention Center',
                hello:    n => `Dear <strong>${n}</strong>,`,
                question: 'Do you need a headset to listen to the interpretation?',
                hint:     l => `Interpretation: ${l}`,
                deadline: d => `Please answer by ${d}. You can change your answer on this page until then.`,
                yes:      'Yes, I need a headset',
                no:       'No, I do not need one',
                saving:   'Saving…',
                saved:    v => v === 'Yes' ? 'Thank you! We have noted that you NEED a headset.'
                                           : 'Thank you! We have noted that you do NOT need a headset.',
                changeNote: 'You can change your answer any time by choosing again.',
                invalid:  'This link is not valid. Please use the link in your email.',
                notfound: 'We could not find your registration. Please contact the secretariat.',
                error:    'Something went wrong. Please check your connection and try again.',
                retry:    'Try again',
                loading:  'Loading…',
                secretariat: 'Secretariat: sx2026_eoj-swat@ej-hds.co.jp'
            },
            ja: {
                title:    '通訳用ヘッドセット',
                event:    'SX2026 スペシャルセミナー · 2026年11月13日<br>クイーン・シリキット国立コンベンションセンター',
                hello:    n => `<strong>${n}</strong> 様`,
                question: '通訳を聞くためのヘッドセットは必要ですか。',
                hint:     l => `通訳：${l}`,
                deadline: d => `${d} までにご回答ください。それまでは、このページで回答を変更できます。`,
                yes:      'はい、必要です',
                no:       'いいえ、不要です',
                saving:   '保存中…',
                saved:    v => v === 'Yes' ? 'ありがとうございます。ヘッドセットは「必要」で承りました。'
                                           : 'ありがとうございます。ヘッドセットは「不要」で承りました。',
                changeNote: '回答は、もう一度選び直すといつでも変更できます。',
                invalid:  'このリンクは無効です。メールに記載のリンクをご利用ください。',
                notfound: 'ご登録情報が見つかりません。事務局までご連絡ください。',
                error:    'エラーが発生しました。通信状況をご確認の上、もう一度お試しください。',
                retry:    '再試行',
                loading:  '読み込み中…',
                secretariat: '事務局：sx2026_eoj-swat@ej-hds.co.jp'
            },
            th: {
                title:    'หูฟังสำหรับล่าม',
                event:    'SX2026 Special Seminar · 13 พฤศจิกายน 2026<br>ศูนย์การประชุมแห่งชาติสิริกิติ์',
                hello:    n => `เรียน คุณ<strong>${n}</strong>`,
                question: 'ท่านต้องการหูฟังสำหรับฟังล่ามหรือไม่',
                hint:     l => `ล่าม: ${l}`,
                deadline: d => `กรุณาตอบภายในวันที่ ${d} และสามารถแก้ไขคำตอบได้ที่หน้านี้จนถึงวันดังกล่าว`,
                yes:      'ต้องการหูฟัง',
                no:       'ไม่ต้องการ',
                saving:   'กำลังบันทึก…',
                saved:    v => v === 'Yes' ? 'ขอบคุณค่ะ/ครับ เราบันทึกแล้วว่าท่าน "ต้องการ" หูฟัง'
                                           : 'ขอบคุณค่ะ/ครับ เราบันทึกแล้วว่าท่าน "ไม่ต้องการ" หูฟัง',
                changeNote: 'ท่านสามารถเปลี่ยนคำตอบได้ทุกเมื่อโดยเลือกใหม่',
                invalid:  'ลิงก์นี้ไม่ถูกต้อง กรุณาใช้ลิงก์จากอีเมล',
                notfound: 'ไม่พบข้อมูลการลงทะเบียนของท่าน กรุณาติดต่อสำนักงานเลขานุการ',
                error:    'เกิดข้อผิดพลาด กรุณาตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง',
                retry:    'ลองอีกครั้ง',
                loading:  'กำลังโหลด…',
                secretariat: 'สำนักงานเลขานุการ: sx2026_eoj-swat@ej-hds.co.jp'
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let lang        = 'en';
        let participant = null;      // { name, headset }
        let current     = '';        // 'Yes' | 'No' | ''
        let lastStatus  = null;      // { kind, key, arg } so the text can be re-rendered when language changes

        const $ = id => document.getElementById(id);

        // The participant ID travels after "#" in the link, so it is not sent to any server
        // by the browser when the page is opened (only when the buttons call the script).
        const participantId = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const t = T[lang];
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang button').forEach(b =>
                b.classList.toggle('active', b.dataset.lang === lang));

            $('t-title').textContent = t.title;
            $('t-event').innerHTML   = t.event;
            $('t-secretariat').textContent = t.secretariat;

            $('t-question').textContent = t.question;
            $('t-hint').textContent     = t.hint(INTERPRETATION[lang]);
            $('t-deadline').textContent = t.deadline(DEADLINE[lang]);
            $('btn-yes').textContent    = t.yes;
            $('btn-no').textContent     = t.no;
            $('retry').textContent      = t.retry;

            if (participant) $('t-hello').innerHTML = t.hello(escapeHtml(participant.name));

            $('btn-yes').classList.toggle('selected', current === 'Yes');
            $('btn-no').classList.toggle('selected',  current === 'No');

            renderStatus();
        }

        function setStatus(kind, key, arg) { lastStatus = { kind, key, arg }; renderStatus(); }
        function clearStatus()             { lastStatus = null; renderStatus(); }

        function renderStatus() {
            const el = $('status');
            if (!lastStatus) { el.className = 'status'; el.innerHTML = ''; return; }
            const t   = T[lang];
            const msg = typeof t[lastStatus.key] === 'function' ? t[lastStatus.key](lastStatus.arg) : t[lastStatus.key];
            el.className = 'status show ' + lastStatus.kind;
            el.innerHTML = escapeHtml(msg) + (lastStatus.kind === 'ok'
                ? '<br><small>' + escapeHtml(t.changeNote) + '</small>' : '');
        }

        function setLang(l) { lang = l; render(); }

        // ============================================================
        // API (Apps Script Web App)
        //   getHeadset : ?action=getHeadset&uniqueId=ID
        //                → { success, name, headset: 'Yes' | 'No' | '' }
        //   setHeadset : ?action=setHeadset&uniqueId=ID&value=Yes|No
        //                → { success, headset }
        // ============================================================
        async function api(params) {
            const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        async function load() {
            $('retry').classList.add('hidden');
            if (!participantId) { setStatus('error', 'invalid'); return; }

            setStatus('loading', 'loading');
            try {
                const r = await api({ action: 'getHeadset', uniqueId: participantId });
                if (!r.success) { setStatus('error', 'notfound'); return; }
                participant = { name: r.name };
                current     = r.headset || '';
                $('form-area').classList.remove('hidden');
                clearStatus();
                render();
            } catch (e) {
                console.error(e);
                setStatus('error', 'error');
                $('retry').classList.remove('hidden');
            }
        }

        // Nothing is saved when the page is merely opened — only when a button is pressed.
        // (Mail scanners that pre-open links therefore cannot answer for the participant.)
        async function choose(value) {
            const buttons = [$('btn-yes'), $('btn-no')];
            buttons.forEach(b => b.disabled = true);
            setStatus('loading', 'saving');
            try {
                const r = await api({ action: 'setHeadset', uniqueId: participantId, value });
                if (!r.success) throw new Error(r.message || 'save failed');
                current = r.headset || value;
                render();
                setStatus('ok', 'saved', current);
            } catch (e) {
                console.error(e);
                setStatus('error', 'error');
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }

        // ============================================================
        // START
        // ============================================================
        (function init() {
            const nav = (navigator.language || 'en').toLowerCase();
            lang = nav.startsWith('ja') ? 'ja' : nav.startsWith('th') ? 'th' : 'en';
            render();
            load();
        })();
    </script>
</body>
</html>
